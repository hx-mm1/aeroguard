# Two palettes; each viewer picks light or dark in the app menu (⋮ → Settings).
[theme.light]
primaryColor = "#0e8fb0"
backgroundColor = "#eef2f6"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#0b1f3a"

[theme.light.sidebar]
backgroundColor = "#0b1f3a"
secondaryBackgroundColor = "#16305a"
textColor = "#e6eef8"
primaryColor = "#38c7e8"

[theme.dark]
primaryColor = "#38c7e8"
backgroundColor = "#070f1c"
secondaryBackgroundColor = "#12223a"
textColor = "#e8eef7"

[theme.dark.sidebar]
backgroundColor = "#0a1526"
secondaryBackgroundColor = "#14284a"
textColor = "#e6eef8"
primaryColor = "#38c7e8"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
